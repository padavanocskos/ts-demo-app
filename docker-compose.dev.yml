version: "3.8"

services:
  api:
    container_name: rails-api-dev
    image: api-app-dev-image
    command: [bundle, exec, rdbg, -n, --open, --host, 0.0.0.0, --port=12345, -c, --, rails, server, -b, '0.0.0.0']
    ports:
      - '3000:3000'
      - '12345:12345'
    expose:
      - 3000
      - 12345
    build:
      context: ./api
    entrypoint: ./bin/docker-entrypoint
    tty: true
    stdin_open: true
    volumes:
      - ./api:/rails
    depends_on:
      - postgres
    links:
      - postgres
    environment:
        DB_HOST: local_pgdb
        DB_USER: rails
        DB_PASSWORD: rails
  react-vite:
    container_name: react-vite-dev
    image: react-vite-dev-image
    build:
      context: ./react
      target: development
      args:
        - NODE_ENV=development
    tty: true
    volumes:
      - ./react:/app
      - /app/node_modules/
    ports:
      - 8000:8000
    expose:
      - 8000
    environment:
      WATCHPACK_POLLING: true
  angular:
    container_name: angular-dev
    image: angular-dev-image
    build:
      context: ./angular
      target: development
      args:
        - NODE_ENV=development
    volumes:
      - ./angular:/app
      - /app/node_modules/
    ports:
      - 4200:4200
    expose:
      - 4200
    environment:
      WATCHPACK_POLLING: true
  postgres:
    image: postgres:16
    container_name: local_pgdb
    environment:
      POSTGRES_USER: rails
      POSTGRES_PASSWORD: rails
    restart: always
    ports:
      - 5432:5432
    volumes:
      - local_pgdata:/var/lib/postgresql/data
    expose:
      - 5432
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - 8888:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
volumes:
  local_pgdata:
  pgadmin-data:
